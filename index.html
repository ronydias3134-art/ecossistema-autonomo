<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar X AI - Ecossistema Autónomo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 2rem;
            border-radius: 12px;
            background-color: #1e293b;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
        }
        .status {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #22c55e;
            color: #ffffff;
            font-weight: bold;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Avatar X AI</h1>
        <p>Ecossistema Autónomo de Conteúdo</p>
        <div class="status">Sistema Ativo & Otimizado</div>
    </div>

</html>
