<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSSISTEMA.HUB</title>
    <style>
        :root {
            --bg-base: #090d16;
            --card-bg: #131b2e;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.2);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Contentor principal equilibrado para telemóvel e PC */
        .main-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Leitor de vídeo compacto, elegante e em alta definição */
        #video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 HD ratio */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        #video-destaque {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-caption {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 8px;
        }

        /* Estilo das restantes funções à volta */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .status-badge {
            color: #22c55e;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>ECOSSISTEMA.HUB</h1>
        <div class="subtitle">Painel de Controlo Dinâmico</div>
    </header>

    <div class="main-container">

        <!-- BLOCO DO VÍDEO (Compacto, bonito e com alta definição) -->
        <div class="card">
            <div id="video-container">
                <iframe 
                    id="video-destaque" 
                    src="" 
                    title="Destaque" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-caption">
                Reprodução otimizada • Toque em ecrã inteiro para expandir
            </div>
        </div>

        <!-- MÓDULOS E FUNÇÕES DO ECOSSISTEMA À VOLTA -->
        <div class="card">
            <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px; color: var(--accent);">Estado do Sistema</div>
            <div class="info-row">
                <span>Servidor FastAPI</span>
                <span class="status-badge">Up and Running</span>
            </div>
            <div class="info-row">
                <span>Motor de Recomendação</span>
                <span style="color: var(--text-muted);">Ativo (Futebol & Engenharia)</span>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE LIGAÇÃO AO BACKEND PARA O VÍDEO -->
    <script>
      async function carregarVideoRecomendado() {
        try {
          const response = await fetch('/api/v1/feed/personalized');
          const data = await response.json();
          if (data && data.video && data.video.url) {
            document.getElementById('video-destaque').src = data.video.url;
          }
        } catch (error) {
          console.log("A aguardar motor de feed...", error);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        carregarVideoRecomendado();
      });
    </script>

</body>
</html>
