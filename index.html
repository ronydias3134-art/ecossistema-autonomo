<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar X AI - Ecossistema Autónomo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0F172A; color: #F1F5F9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); background: #1E293B; }
        h1 { color: #3B82F6; text-align: center; font-size: 24px; margin-bottom: 10px; }
        .status { text-align: center; color: #4ADE80; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
        .chat-box { background: #0F172A; height: 300px; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .user-msg { background: #0284C7; align-self: flex-end; color: white; }
        .ai-msg { background: #334155; align-self: flex-start; color: white; }
        .error-msg { background: #B91C1C; align-self: flex-start; color: white; font-weight: bold;}
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0F172A; color: white; }
        button { background: #0284C7; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369A1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Avatar X AI</h1>
    <div class="status" id="systemStatus">Sistema Ativo (V9 / Circuito Global)</div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Olá Ronny! O ecossistema autónomo está online. Como posso ajudar o Circuito Global hoje?</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Escreva sua mensagem para o Avatar X..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();

        if (!text) return;

        // Adiciona mensagem do utilizador ao chat
        chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Envia para o backend (API local ou Vercel)
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: text }),
            });

            if (!response.ok) {
                throw new Error('Falha na comunicação com o servidor');
            }

            const data = await response.json();

            // Adiciona resposta da IA ao chat
            chatBox.innerHTML += `<div class="message ai-msg">${data.response}</div>`;
        } catch (error) {
            console.error(error);
            chatBox.innerHTML += `<div class="message error-msg">ERRO: ${error.message}</div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
