
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSSISTEMA.HUB</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            color: #fff;
        }
        /* Estilo do Mini-Leitor Compacto (Poupa Megas e liberta o ecrã) */
        #video-container {
            width: 100%;
            max-width: 320px;
            margin: 15px auto;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-info {
            padding: 8px;
            font-size: 11px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>ECOSSISTEMA.HUB</h1>

    <!-- MINI-LEITOR INTELIGENTE E COMPACTO -->
    <div id="video-container">
        <div class="video-wrapper">
            <iframe 
                id="video-destaque" 
                src="" 
                title="Destaque do Dia" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
        <div class="video-info">
            Modo Compacto • Clique em ecrã inteiro para expandir
        </div>
    </div>

    <!-- O RESTO DO TEU CONTEÚDO E FUNÇÕES DA PÁGINA FICAM LIVRES AQUI EMBAIXO -->

    <!-- SCRIPT DE RECOMENDAÇÃO INTELIGENTE -->
    <script>
      async function carregarVideoRecomendado(categoria) {
        try {
          const response = await fetch(`/api/v1/feed/personalized?interest=${categoria || ''}`);
          const data = await response.json();
          if (data && data.video && data.video.url) {
            document.getElementById('video-destaque').src = data.video.url;
          }
        } catch (error) {
          console.log("A carregar leitor padrão:", error);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        carregarVideoRecomendado();
      });
    </script>

</body>
</html>
