<!-- CÓDIGO PARA O FICHEIRO INDEX -->
<div id="video-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: 8px;">
  <iframe 
    id="video-destaque" 
    src="https://www.youtube-nocookie.com/embed/5qap5aO4i9A?autoplay=0&rel=0" 
    title="Destaque do Dia" 
    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>
</div>

<!-- SCRIPT DE RECOMENDAÇÃO INTELIGENTE -->
<script>
  async function carregarVideoRecomendado(categoria) {
    try {
      const response = await fetch(`/api/v1/feed/personalized?interest=${categoria || ''}`);
      const data = await response.json();
      if (data && data.video && data.video.url) {
        document.getElementById('video-destaque').src = data.video.url;
      }
    } catch (error) {
      console.log("A carregar leitor padrão:", error);
    }
  }

  // Carrega o vídeo personalizado assim que o Hub abre
  window.addEventListener('DOMContentLoaded', () => {
    carregarVideoRecomendado();
  });
</script>
