<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSSISTEMA.HUB</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #fff;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }
        /* Contenedor centralizado e compacto para o vídeo (poupa megas) */
        .video-section {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        #video-container {
            width: 100%;
            max-width: 320px;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-info {
            padding: 8px;
            font-size: 11px;
            color: #aaa;
            text-align: center;
        }
        /* Área para os teus outros menus e funções em volta */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .card {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>ECOSSISTEMA.HUB</h1>
    <div class="subtitle">Painel Autónomo & Inteligente</div>

    <!-- VÍDEO COMPACTO NO CENTRO (DEIXA O RESTO DO ECRÃ LIVRE) -->
    <div class="video-section">
        <div id="video-container">
            <div class="video-wrapper">
                <iframe 
                    id="video-destaque" 
                    src="" 
                    title="Destaque do Dia" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">
                Modo Compacto • Clica no ecrã inteiro para expandir
            </div>
        </div>
    </div>

    <!-- OS TEUS DADOS, MENUS E FUNÇÕES EM VOLTA -->
    <div class="dashboard-grid">
        <div class="card">
            <h3>Estado do Sistema</h3>
            <p>Servidores: <span style="color: #4CAF50;">Up and Running</span></p>
        </div>
        <div class="card">
            <h3>Motor de Recomendação</h3>
            <p>A carregar interesses personalizados em tempo real (Futebol, Engenharia, Música).</p>
        </div>
    </div>

    <!-- SCRIPT DE RECOMENDAÇÃO INTELIGENTE -->
    <script>
      async function carregarVideoRecomendado() {
        try {
          const response = await fetch('/api/v1/feed/personalized');
          const data = await response.json();
          if (data && data.video && data.video.url) {
            document.getElementById('video-destaque').src = data.video.url;
          }
        } catch (error) {
          console.log("A carregar leitor padrão:", error);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        carregarVideoRecomendado();
      });
    </script>

</body>
</html>
