<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO LEANDRO - Central de Operações</title>
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #131B2E;
            --bg-card-hover: #1D2A44;
            --accent-blue: #00F0FF;
            --accent-purple: #7000FF;
            --accent-red: #FF0055;
            --text-primary: #FFFFFF;
            --text-secondary: #A0AEC0;
            --border-color: #2D3748;
            --glow-blue: rgba(0, 240, 255, 0.4);
            --glow-purple: rgba(112, 0, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1A2035 0%, #0B0F19 100%);
            color: var(--text-primary);
            padding: 12px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* TÍTULO PRINCIPAL VIBRANTE */
        h1 {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, var(--accent-blue), #00A3FF, #7000FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 14px;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* 1. BUSCADOR PRIMEIRO */
        .search-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-container input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            background: rgba(19, 27, 46, 0.8);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px var(--glow-blue);
        }

        .search-container button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent-blue), #0066FF);
            color: #000;
            font-weight: bold;
            font-size: 0.88rem;
            cursor: pointer;
            box-shadow: 0 0 15px var(--glow-blue);
            transition: all 0.3s ease;
        }

        .search-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px var(--glow-blue);
        }

        /* 2. DISPLAY INTELIGENTE EM SEGUNDO */
        .display-inteligente {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .display-inteligente video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .display-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(11, 15, 25, 0.85);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: bold;
            border: 1px solid var(--accent-blue);
            box-shadow: 0 0 10px var(--glow-blue);
            backdrop-filter: blur(4px);
        }

        .section-title {
            font-size: 0.78rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            margin-top: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* GRELHA DE MÓDULOS COMPACTA */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (min-width: 480px) {
            .modules-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .module-btn {
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.9), rgba(29, 42, 68, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .module-btn:hover {
            background: linear-gradient(135deg, #1D2A44, #2A3B5E);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--glow-blue);
        }

        /* BENFICA DESTAQUE */
        .module-btn.benfica-btn {
            border-color: rgba(255, 0, 85, 0.5);
            background: linear-gradient(135deg, rgba(69, 10, 10, 0.8), rgba(29, 42, 68, 0.8));
        }

        .module-btn.benfica-btn:hover {
            background: linear-gradient(135deg, #FF0055, #88002D);
            border-color: #FF0055;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.5);
        }

        /* PAINEL DA BIBLIOTECA DO MÓDULO */
        .library-panel {
            background: rgba(19, 27, 46, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
            min-height: 120px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .library-header {
            font-size: 0.92rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: capitalize;
            text-shadow: 0 0 8px var(--glow-blue);
        }

        .library-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .library-item {
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid var(--accent-blue);
            border-radius: 6px;
            padding: 12px;
            transition: all 0.2s ease;
        }

        .library-item:hover {
            border-left-color: var(--accent-purple);
            background: rgba(19, 27, 46, 0.9);
        }

        .library-item h4 {
            color: var(--text-primary);
            font-size: 0.88rem;
            margin-bottom: 4px;
        }

        .library-item p {
            color: var(--text-secondary);
            font-size: 0.82rem;
            line-height: 1.4;
        }

        /* REDES SOCIAIS E ATALHOS */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .tool-link {
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.9), rgba(29, 42, 68, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            display: block;
            transition: all 0.25s ease;
        }

        .tool-link:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px var(--glow-purple);
            transform: translateY(-2px);
        }

        /* ASSINATURA ESTÉTICA FINAL */
        .footer-signature {
            text-align: center;
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.78rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .footer-signature span {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0 0 10px var(--glow-blue);
        }
    </style>
</head>
<body>

    <h1>PROJETO LEANDRO - CENTRAL DE OPERAÇÕES</h1>

    <!-- 1. BUSCADOR PRIMEIRO -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Pesquisar ou adicionar à biblioteca do módulo..." onkeypress="verificarEnter(event)">
        <button type="button" onclick="executarPesquisa()">Pesquisar</button>
    </div>

    <!-- 2. DISPLAY INTELIGENTE EM SEGUNDO -->
    <div class="display-inteligente">
        <div class="display-overlay" id="displayTag">DISPLAY: GERAL</div>
        <video id="mainDisplayVideo" autoplay muted playsinline loop>
            <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
            O seu navegador não suporta o leitor.
        </video>
    </div>

    <!-- MÓDULOS INFORMATIVOS E DE ENTRETENIMENTO -->
    <div class="section-title">⚡ Informação e Entretenimento</div>
    <div class="modules-grid">
        <button class="module-btn" onclick="carregarModulo('noticias')">📰 Notícias <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('desporto')">⚽ Desporto <span>▶</span></button>
        <button class="module-btn benfica-btn" onclick="carregarModulo('benfica')">🦅 Benfica <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('musica')">🎵 Música <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('jogos')">🎮 Jogos Online <span>▶</span></button>
    </div>

    <!-- MÓDULOS PROFISSIONAIS INTEGRADOS -->
    <div class="section-title">🛠️ Módulos Profissionais Operacionais</div>
    <div class="modules-grid">
        <button class="module-btn" onclick="carregarModulo('arquitetura')">🏗️ Arquitetura <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('agricultura')">🌱 Agricultura <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('engenharia')">⚙️ Engenharia <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('pesca')">🐟 Pesca <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('educacao')">🎓 Educação <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('saude')">🩺 Saúde <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('economia')">📈 Economia <span>▶</span></button>
        <button class="module-btn" onclick="carregarModulo('geral')">🌐 Geral / Outras <span>▶</span></button>
    </div>

    <!-- PAINEL DA BIBLIOTECA DO MÓDULO -->
    <div class="library-panel">
        <div class="library-header" id="moduloTitulo">Biblioteca do Módulo: GERAL</div>
        <div class="library-content" id="libraryContent">
            <!-- Os resultados e pesquisas aparecerão aqui de forma dinâmica -->
        </div>
    </div>

    <!-- REDES SOCIAIS E ATALHOS -->
    <div class="section-title">🌐 Redes Sociais e Ligações</div>
    <div class="tools-grid">
        <a href="https://www.facebook.com" target="_blank" class="tool-link">📘 Facebook</a>
        <a href="https://www.youtube.com" target="_blank" class="tool-link">▶️ YouTube</a>
        <a href="https://chatgpt.com" target="_blank" class="tool-link">🤖 ChatGPT</a>
        <a href="https://gemini.google.com" target="_blank" class="tool-link">✨ Gemini Engine</a>
    </div>

    <!-- ASSINATURA ESTÉTICA FINAL -->
    <div class="footer-signature">
        Projetado & Desenvolvido por <span>Ronny Dias</span>
    </div>

    <script>
        let moduloAtual = "geral";

        function verificarEnter(event) {
            if (event.key === 'Enter') {
                executarPesquisa();
            }
        }

        function carregarModulo(nomeModulo) {
            moduloAtual = nomeModulo.toLowerCase();
            
            const tituloFormatado = moduloAtual.toUpperCase();
            document.getElementById('moduloTitulo').innerText = `Biblioteca do Módulo: ${tituloFormatado}`;
            document.getElementById('displayTag').innerText = `DISPLAY: ${tituloFormatado}`;
            
            // Força a reprodução do display
            const player = document.getElementById('mainDisplayVideo');
            if (player) {
                player.load();
                player.play().catch(e => console.log("Autoplay aguarda interação."));
            }

            fetch(`/api/modulo/${moduloAtual}`)
                .then(res => res.json())
                .then(data => {
                    renderizarBiblioteca(data.biblioteca || []);
                })
                .catch(err => console.error("Erro ao carregar o módulo:", err));
        }

        function renderizarBiblioteca(itens) {
            const container = document.getElementById('libraryContent');
            container.innerHTML = "";

            if (!itens || itens.length === 0) {
                container.innerHTML = "<p style='color: var(--text-secondary); font-size: 0.8rem;'>Módulo pronto. Escreva na barra acima para adicionar conteúdos a esta biblioteca.</p>";
                return;
            }

            itens.forEach(item => {
                const div = document.createElement('div');
                div.className = 'library-item';
                div.innerHTML = `<h4>${item.titulo}</h4><p>${item.conteudo}</p>`;
                container.appendChild(div);
            });
        }

        function executarPesquisa() {
            const input = document.getElementById('searchInput');
            if (!input) return;
            
            const termo = input.value.trim();
            if (!termo) return;

            fetch('/api/pesquisar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ modulo: moduloAtual, termo: termo })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "sucesso") {
                    renderizarBiblioteca(data.biblioteca_atualizada);
                    input.value = "";
                }
            })
            .catch(err => console.error("Erro na pesquisa:", err));
        }
    </script>
</body>
</html>
