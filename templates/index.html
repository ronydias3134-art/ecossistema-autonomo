<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuito Global — Ecossistema Autónomo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: #38bdf8;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            max-width: 75%;
            line-height: 1.5;
            word-break: break-word;
        }
        .user-message {
            background-color: #0284c7;
            color: white;
            align-self: flex-end;
        }
        .bot-message {
            background-color: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        #input-container {
            background-color: #1e293b;
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            border-top: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.375rem;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Circuito Global — Ecossistema Autónomo</h1>
    </header>

    <div id="chat-container">
        <div class="message bot-message">Olá, Ronny! O Ecossistema Autónomo está online e pronto. Como posso ajudar-te hoje?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escreve a tua mensagem..." autocomplete="off">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Adicionar mensagem do utilizador
            appendMessage(text, 'user-message');
            userInput.value = '';

            // Mensagem temporária de "A processar..."
            const loadingId = appendMessage('A processar...', 'bot-message');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Remover mensagem de loading
                document.getElementById(loadingId).remove();

                if (data.response) {
                    appendMessage(data.response, 'bot-message');
                } else {
                    appendMessage('Erro: ' + (data.error || 'Resposta inválida do servidor.'), 'bot-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Erro de ligação ao servidor.', 'bot-message');
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
