<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuito Global — Ecossistema Autónomo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            background-color: #1e293b;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .status-badge {
            font-size: 0.875rem;
            color: #4ade80;
            margin-top: 5px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }
        .system-message {
            background-color: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-left: 4px solid #38bdf8;
        }
        .user-message {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
        }
        #input-container {
            padding: 15px;
            background-color: #1e293b;
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Circuito Global</h1>
        <div class="status-badge">● Sistema Autónomo Ativo (CVE / Flask)</div>
    </header>

    <div id="chat-container">
        <div class="message system-message">
            Olá, Ronny! O **Circuito Global — Ecossistema Autónomo** está operacional. Como posso ajudar hoje?
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Escreve a tua mensagem...">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            const chatContainer = document.getElementById('chat-container');

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.innerText = messageText;
            chatContainer.appendChild(userDiv);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await response.json();
                
                const sysDiv = document.createElement('div');
                sysDiv.className = 'message system-message';
                sysDiv.innerText = data.response || "Erro na resposta do sistema.";
                chatContainer.appendChild(sysDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (err) {
                console.error("Erro na comunicação com o servidor:", err);
            }
        }
    </script>

</body>
</html>
