<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecossistema Autónomo</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-color: #48cae4;
            --text-color: #ffffff;
            --user-msg: #0077b6;
            --bot-msg: #1f2a44;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px;
            text-align: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid #3a506b;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-msg);
            border: 1px solid #3a506b;
        }

        #input-container {
            padding: 15px;
            background-color: var(--card-bg);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a506b;
            background-color: #0b132b;
            color: white;
            outline: none;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #0077b6;
            color: white;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: #0096c7;
        }

        #mic-btn {
            background-color: #3a506b;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            padding: 0;
            font-size: 18px;
        }

        #mic-btn.recording {
            background-color: #e63946;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h2>Circuito Global — Ecossistema Autónomo</h2>
    </header>

    <div id="chat-container">
        <div class="message bot-message">
            Olá, Ronny! O Ecossistema Autónomo está online e pronto. Como posso ajudar-te hoje?
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escreve a tua mensagem..." onkeypress="handleKeyPress(event)">
        
        <!-- Botão do Microfone -->
        <button id="mic-btn" onclick="toggleSpeech()" title="Falar por voz">
            🎙️
        </button>

        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        let recognition = null;
        let isRecording = false;

        // Configuração do Reconhecimento de Voz
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-PT';
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };

            recognition.onerror = () => {
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };
        } else {
            micBtn.style.display = 'none';
        }

        function toggleSpeech() {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopRecording() {
            isRecording = false;
            micBtn.classList.remove('recording');
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Adiciona mensagem do utilizador
            appendMessage(text, 'user-message');
            userInput.value = '';

            // Indicador de processamento
            const loadingDiv = appendMessage('A processar...', 'bot-message');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                loadingDiv.innerText = data.response || "Sem resposta do servidor.";
                
                // Leitura em Voz Alta
                speakText(loadingDiv.innerText);

            } catch (error) {
                loadingDiv.innerText = "Erro ao comunicar com o servidor.";
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-PT';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
