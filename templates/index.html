<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecossistema Autónomo - Chat Gemini</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }
        .user-message {
            background-color: #2563eb;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #334155;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1e293b;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 0 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message ai-message">Olá! Como te posso ajudar hoje?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escreve uma mensagem para a IA..." autocomplete="off">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Adiciona a mensagem do utilizador ao chat
            appendMessage(message, 'user-message');
            userInput.value = '';

            // Mensagem temporária de carregamento
            const loadingId = appendMessage('A pensar...', 'ai-message');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                // Remove a mensagem de carregamento e coloca a resposta real
                document.getElementById(loadingId).remove();
                appendMessage(data.response || 'Erro na resposta do servidor.', 'ai-message');

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Erro ao comunicar com o servidor.', 'ai-message');
            }
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            const id = 'msg-' + Date.now();
            messageDiv.id = id;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
